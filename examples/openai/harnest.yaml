version: "0.1"
components:
  - id: prompt
    type: prompt
    config:
      template: "Reply in one short paragraph: {{input}}"
  - id: model
    type: model
    config:
      adapter: openai
      model: gpt-5-mini
      apiKey: env:OPENAI_API_KEY
      maxTokens: 500
  - id: agent
    type: agent
    config:
      system: You are a precise assistant.
  - id: output
    type: output
    config: { format: text }
connections:
  - from: { component: model, port: model }
    to: { component: agent, port: model }
  - from: { component: prompt, port: prompt }
    to: { component: agent, port: prompt }
  - from: { component: agent, port: response }
    to: { component: output, port: value }
entrypoint: output
runtime:
  timeoutMs: 30000
  adapters: ["@harnestai/adapter-openai"]
