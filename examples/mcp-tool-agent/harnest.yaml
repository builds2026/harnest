version: "0.2"
components:
  - id: arguments
    type: memory
    config:
      key: mcp-example-arguments
      operation: read
      initial: { city: Seoul }
  - id: cityTool
    type: mcp-tool
    config:
      transport: stdio
      protocol: legacy
      command: node
      args: [server.mjs]
      tool: lookup-city
      timeoutMs: 10000
  - id: model
    type: model
    config: { adapter: mcp-agent-echo, model: deterministic-tool-agent }
  - id: prompt
    type: prompt
    config:
      template: "Answer the request using only the connected tool result: {{input}}"
  - id: agent
    type: agent
    config: {}
  - id: output
    type: output
    config: { format: text }
connections:
  - from: { component: arguments, port: memory }
    to: { component: cityTool, port: arguments }
  - from: { component: cityTool, port: result }
    to: { component: agent, port: toolResults }
  - from: { component: model, port: model }
    to: { component: agent, port: model }
  - from: { component: prompt, port: prompt }
    to: { component: agent, port: prompt }
  - from: { component: agent, port: response }
    to: { component: output, port: value }
entrypoint: output
runtime:
  timeoutMs: 30000
  adapters: [./agent-adapter.mjs]
tests:
  - id: finds-seoul
    input: Which country contains the configured city?
    assertions:
      - { type: includes, value: Seoul }
      - { type: includes, value: South Korea }
      - { type: tool-called, tool: lookup-city, minCalls: 1, maxCalls: 1 }
studio:
  positions:
    arguments: { x: 40, y: 60 }
    cityTool: { x: 320, y: 60 }
    model: { x: 40, y: 260 }
    prompt: { x: 40, y: 430 }
    agent: { x: 610, y: 230 }
    output: { x: 900, y: 230 }
