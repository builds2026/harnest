version: "0.2"
components:
  - id: model
    type: model
    config:
      adapter: gemini
      model: gemini-3.5-flash-lite
      apiKey: env:GEMINI_API_KEY
      maxTokens: 1000
  - id: prompt
    type: prompt
    config:
      template: |-
        Answer the user's request clearly and concisely in Korean.

        User request: {{input}}
  - id: agent
    type: agent
    config: {}
  - id: output
    type: output
    config:
      format: text
connections:
  - id: model_to_agent
    from: { component: model, port: model }
    to: { component: agent, port: model }
  - id: prompt_to_agent
    from: { component: prompt, port: prompt }
    to: { component: agent, port: prompt }
  - id: agent_to_output
    from: { component: agent, port: response }
    to: { component: output, port: value }
entrypoint: output
runtime:
  timeoutMs: 30000
studio:
  positions:
    model: { x: 60, y: 40 }
    prompt: { x: 60, y: 220 }
    agent: { x: 390, y: 120 }
    output: { x: 720, y: 120 }
