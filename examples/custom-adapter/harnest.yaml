version: "0.1"
components:
  - id: prompt
    type: prompt
    config: { template: "Custom adapter received: {{input}}" }
  - id: model
    type: model
    config: { adapter: echo, model: echo-v1 }
  - id: agent
    type: agent
    config: {}
  - id: output
    type: output
    config: { format: text }
connections:
  - from: { component: model, port: model }
    to: { component: agent, port: model }
  - from: { component: prompt, port: prompt }
    to: { component: agent, port: prompt }
  - from: { component: agent, port: response }
    to: { component: output, port: value }
entrypoint: output
runtime:
  adapters: [./echo-adapter.mjs]
