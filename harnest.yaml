components:
  - id: prompt
    type: prompt
    config:
      template: "Answer this request clearly: {{input}}"
  - id: model
    type: model
    config:
      adapter: echo
      model: echo-v1
  - id: agent
    type: agent
    config:
      system: You are a concise local demo agent.
  - id: output
    type: output
    config:
      format: text
connections:
  - from:
      component: model
      port: model
    to:
      component: agent
      port: model
  - from:
      component: prompt
      port: prompt
    to:
      component: agent
      port: prompt
  - from:
      component: agent
      port: response
    to:
      component: output
      port: value
entrypoint: output
version: "0.2"
runtime:
  timeoutMs: 30000
  adapters:
    - ./examples/custom-adapter/echo-adapter.mjs
tests:
  - id: passes-input
    input: hello harness
    assertion:
      type: includes
      value: hello harness
studio:
  positions:
    prompt:
      x: 80
      y: 90
    model:
      x: 80
      y: 280
    agent:
      x: 390
      y: 180
    output:
      x: 784
      y: 224
