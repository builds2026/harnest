components:
  - id: plan
    type: subgraph
    config:
      subgraph: planner
  - id: executeUntilDone
    type: loop
    config:
      subgraph: engineeringLoop
      maxIterations: 4
      carry: merge
      checkpoint: structured
      timeoutMs: 240000
      maxTokens: 1000000
      until:
        source: value
        path: /status
        op: equals
        value: complete
  - id: finalAnswer
    type: output
    config:
      format: text
connections:
  - id: plan_to_loop
    from:
      component: plan
      port: value
    to:
      component: executeUntilDone
      port: value
  - id: loop_to_output
    from:
      component: executeUntilDone
      port: value
    to:
      component: finalAnswer
      port: value
    select: /finalAnswer
entrypoint: finalAnswer
version: "0.3"
subgraphs:
  planner:
    components:
      - id: model
        type: model
        config:
          connectionId: connection_10e2a78a953a436abb264b8128e4e8cb
          temperature: 0.1
          maxTokens: 2500
      - id: prompt
        type: prompt
        config:
          template: |-
            Project prompt: .harnest/prompts/planner.md

            {{input}}
      - id: policy
        type: context
        config:
          source: file
          path: .harnest/context/planner-policy.md
      - id: plannerMemory
        type: memory
        config:
          key: universalHarnessPreferences
          operation: read
          initial:
            language: ko
            citations: true
            verifyBeforeFinal: true
      - id: agent
        type: agent
        config:
          system: |-
            당신은 실행 계획 담당자다. 답변을 완성하지 말고 다음 에이전트가 실행할 구체적인 계획을 작성하라.
            반드시 지정된 JSON Schema로만 응답하고 originalRequest에는 사용자 요청 전문을 보존한다.
            status는 continue, currentResult와 finalAnswer는 빈 문자열, validation.passed는 false로 초기화한다.
          maxTurns: 2
          maxTokens: 3000
          multimodal: false
      - id: output
        type: output
        config:
          format: json
    connections:
      - id: planner_model
        from:
          component: model
          port: model
        to:
          component: agent
          port: model
      - id: planner_prompt
        from:
          component: prompt
          port: prompt
        to:
          component: agent
          port: prompt
      - id: planner_policy
        from:
          component: policy
          port: context
        to:
          component: agent
          port: context
      - id: planner_memory
        from:
          component: plannerMemory
          port: memory
        to:
          component: agent
          port: memory
      - id: planner_output
        from:
          component: agent
          port: response
        to:
          component: output
          port: value
    entrypoint: output
  engineeringLoop:
    components:
      - id: model
        type: model
        config:
          temperature: 0.2
          maxTokens: 6000
          connectionId: connection_10e2a78a953a436abb264b8128e4e8cb
      - id: prompt
        type: prompt
        config:
          template: |-
            Project prompt: .harnest/prompts/engineering-loop.md

            {{input}}
      - id: operatingPolicy
        type: context
        config:
          source: file
          path: .harnest/context/engineering-policy.md
      - id: workingMemory
        type: memory
        config:
          key: universalHarnessWorkingMemory
          operation: read
          initial:
            objective: finish the user goal
            iterationPolicy: inspect-act-verify
      - id: webSearch
        type: tool
        config:
          tool: builtin.web-search
          connectionId: connection_2b89fce0b0ce477997fb43c97e3bda7f
          source: builtin
          risk: read
          label: Web Search
      - id: webScrape
        type: tool
        config:
          tool: builtin.web-scrape
          connectionId: connection_2b89fce0b0ce477997fb43c97e3bda7f
          source: builtin
          risk: read
          label: Web Scrape
      - id: codeInterpreter
        type: tool
        config:
          tool: builtin.code-runner
          connectionId: connection_aa06453f960843febae518949effeda6
          source: builtin
          risk: destructive
          label: Python Code Interpreter
      - id: fileWorkspace
        type: tool
        config:
          tool: builtin.file
          connectionId: connection_aa06453f960843febae518949effeda6
          source: builtin
          risk: write
          label: Workspace Files
      - id: sandboxShell
        type: tool
        config:
          tool: builtin.shell
          connectionId: connection_aa06453f960843febae518949effeda6
          source: builtin
          risk: destructive
          label: Sandbox Shell
      - id: webResearchSkill
        type: skill
        config:
          skill: loop-engineering
      - id: agent
        type: agent
        config:
          system: |-
            당신은 목표 달성형 리서치·코딩 에이전트다.
            입력을 관찰하고, 필요한 도구를 호출하고, 결과를 검증하는 루프를 스스로 수행한다.
            검색만 하고 끝내거나 코드를 작성만 하지 말고 실제 도구 결과를 확인한 뒤 결론을 낸다.
            지정된 JSON Schema만 출력한다. 원본 요청과 계획은 런타임이 보존하므로 현재 결과·검증·남은 작업·완료 상태만 갱신한다.
          maxTurns: 12
          maxToolCalls: 16
          toolTimeoutMs: 60000
          timeoutMs: 180000
          maxTokens: 1000000
          toolError: fail
          allowTools:
            - builtin.web-search
            - builtin.web-scrape
            - builtin.code-runner
            - builtin.file
            - builtin.shell
      - id: iterationState
        type: output
        config:
          format: json
    connections:
      - id: loop_model
        from:
          component: model
          port: model
        to:
          component: agent
          port: model
      - id: loop_prompt
        from:
          component: prompt
          port: prompt
        to:
          component: agent
          port: prompt
      - id: loop_policy
        from:
          component: operatingPolicy
          port: context
        to:
          component: agent
          port: context
      - id: loop_memory
        from:
          component: workingMemory
          port: memory
        to:
          component: agent
          port: memory
      - id: loop_search
        from:
          component: webSearch
          port: tool
        to:
          component: agent
          port: tools
      - id: loop_scrape
        from:
          component: webScrape
          port: tool
        to:
          component: agent
          port: tools
      - id: loop_code
        from:
          component: codeInterpreter
          port: tool
        to:
          component: agent
          port: tools
      - id: loop_files
        from:
          component: fileWorkspace
          port: tool
        to:
          component: agent
          port: tools
      - id: loop_shell
        from:
          component: sandboxShell
          port: tool
        to:
          component: agent
          port: tools
      - id: loop_skill
        from:
          component: webResearchSkill
          port: skill
        to:
          component: agent
          port: skills
      - id: loop_state
        from:
          component: agent
          port: response
        to:
          component: iterationState
          port: value
    entrypoint: iterationState
runtime:
  timeoutMs: 300000
